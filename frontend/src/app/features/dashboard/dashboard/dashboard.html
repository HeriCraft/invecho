<div class="h-screen flex overflow-hidden bg-slate-50 dark:bg-slate-900 transition-colors duration-200">
  
  <!-- Mobile sidebar backdrop -->
  <div *ngIf="isSidebarOpen()" (click)="toggleSidebar()"
       class="fixed inset-0 z-40 bg-slate-900/80 backdrop-blur-sm lg:hidden transition-opacity"></div>

  <!-- Sidebar -->
  <div [class.translate-x-0]="isSidebarOpen()" [class.-translate-x-full]="!isSidebarOpen()"
       class="fixed inset-y-0 left-0 z-50 w-72 flex flex-col bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transition-transform duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-0 lg:flex">
    
    <!-- Sidebar Header (Logo) -->
    <div class="flex items-center justify-between h-16 px-6 border-b border-slate-200 dark:border-slate-800">
      <div class="flex items-center gap-2">
        <svg class="w-8 h-8 text-indigo-600 dark:text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
        <span class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Invecho</span>
      </div>
      <!-- Close button (mobile) -->
      <button (click)="toggleSidebar()" class="lg:hidden text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 focus:outline-none">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Navigation -->
    <div class="flex-1 overflow-y-auto py-4 px-3">
      <nav class="space-y-1">
        <a routerLink="/dashboard/users" routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400 font-medium"
           [routerLinkActiveOptions]="{exact: false}"
           class="text-slate-600 dark:text-slate-300 hover:bg-slate-50 hover:text-slate-900 dark:hover:bg-slate-800/50 dark:hover:text-white group flex items-center px-3 py-2.5 text-sm rounded-lg transition-colors duration-200">
          <svg class="flex-shrink-0 w-5 h-5 mr-3" [class.text-indigo-600]="currentRoute().includes('/dashboard/users')" [class.dark:text-indigo-400]="currentRoute().includes('/dashboard/users')" [class.text-slate-400]="!currentRoute().includes('/dashboard/users')" [class.dark:text-slate-500]="!currentRoute().includes('/dashboard/users')" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
          </svg>
          Gestion des utilisateurs
        </a>
        <a routerLink="/dashboard/settings" routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400 font-medium"
           [routerLinkActiveOptions]="{exact: false}"
           class="text-slate-600 dark:text-slate-300 hover:bg-slate-50 hover:text-slate-900 dark:hover:bg-slate-800/50 dark:hover:text-white group flex items-center px-3 py-2.5 text-sm rounded-lg transition-colors duration-200">
          <svg class="flex-shrink-0 w-5 h-5 mr-3" [class.text-indigo-600]="currentRoute().includes('/dashboard/settings')" [class.dark:text-indigo-400]="currentRoute().includes('/dashboard/settings')" [class.text-slate-400]="!currentRoute().includes('/dashboard/settings')" [class.dark:text-slate-500]="!currentRoute().includes('/dashboard/settings')" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 011.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.56.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 01-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.397.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 01-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.505-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.107-1.204l-.527-.738a1.125 1.125 0 01.12-1.45l.773-.773a1.125 1.125 0 011.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Paramètres
        </a>
      </nav>
    </div>
    
    <!-- User Profile & Logout -->
    <div class="flex-shrink-0 p-4 border-t border-slate-200 dark:border-slate-800">
      <div class="flex items-center w-full">
        <div class="h-10 w-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold shadow-sm">
          {{ authService.currentUser()?.username?.[0] | uppercase }}
        </div>
        <div class="ml-3 flex-1 overflow-hidden">
          <p class="text-sm font-medium text-slate-900 dark:text-white truncate">
            {{ authService.currentUser()?.username }}
          </p>
          <p class="text-xs font-medium text-slate-500 dark:text-slate-400 truncate">
            SUPER_ADMIN
          </p>
        </div>
        <button (click)="logout()" title="Se déconnecter" class="ml-2 p-2 text-slate-400 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Main content wrapper -->
  <div class="flex flex-col w-0 flex-1 overflow-hidden">
    
    <!-- Header -->
    <header class="flex items-center justify-between h-16 px-4 sm:px-6 lg:px-8 border-b border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm z-20">
      <div class="flex items-center gap-4">
        <button (click)="toggleSidebar()" class="lg:hidden text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500 rounded-md p-1">
          <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" />
          </svg>
        </button>
        <h1 class="text-xl font-semibold text-slate-900 dark:text-white transition-colors duration-200">
          {{ pageTitle() }}
        </h1>
      </div>
      <div class="flex items-center">
        <app-theme-toggle></app-theme-toggle>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative z-0 overflow-y-auto focus:outline-none p-4 sm:p-6 lg:p-8">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
